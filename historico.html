<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FUMPAPA — Historico da Frota</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/exceljs/4.4.0/exceljs.min.js"></script>
<style>
:root{
  --g1:#0f2a5c;--g2:#16305c;--g3:#1d4ed8;--g4:#2e86de;
  --glt:#5aa9f0;--gbg:#eaf1fb;--gcard:#d6e6fa;
  --w:#fff;--txt:#0a1f10;--muted:#4a6b54;--brd:#a9c6ec;
  --acc:#00c85a;--warn:#f59e0b;--danger:#ef4444;
  --shadow:0 2px 16px rgba(13,59,30,.10);
}
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:'DM Sans',sans-serif;background:var(--gbg);color:var(--txt);min-height:100vh;}

.header{background:linear-gradient(135deg,var(--g1) 0%,var(--g2) 50%,var(--g3) 100%);display:flex;align-items:stretch;box-shadow:0 4px 24px rgba(0,0,0,.3);}
.logo-zone{display:flex;align-items:center;gap:12px;padding:10px 20px;background:rgba(255,255,255,.08);min-width:200px;border-right:1px solid rgba(255,255,255,.1);}
.logo-zone img{height:50px;object-fit:contain;border-radius:6px;}
.hdr-info{flex:1;padding:10px 20px;display:flex;flex-direction:column;justify-content:center;}
.hdr-info h1{font-family:'Syne',sans-serif;font-size:20px;font-weight:800;color:#fff;letter-spacing:.5px;}
.hdr-info p{font-size:11px;color:rgba(255,255,255,.65);margin-top:2px;}
.hdr-voltar{display:flex;align-items:center;padding:0 20px;}
.hdr-voltar a{color:#fff;text-decoration:none;font-family:'Syne',sans-serif;font-size:12px;font-weight:700;background:rgba(255,255,255,.12);padding:8px 14px;border-radius:8px;}
.hdr-voltar a:hover{background:rgba(255,255,255,.22);}

.main{max-width:1200px;margin:0 auto;padding:22px;}

.sec{background:#fff;border-radius:14px;padding:20px;margin-bottom:20px;box-shadow:var(--shadow);}
.sec-title{font-family:'Syne',sans-serif;font-size:16px;font-weight:700;color:var(--g1);margin-bottom:14px;}

.filtros{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-end;margin-bottom:14px;}
.campo{display:flex;flex-direction:column;gap:4px;}
.campo label{font-size:11px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.5px;}
select,input{padding:9px 10px;border:1px solid var(--brd);border-radius:8px;font-size:13px;font-family:'DM Sans',sans-serif;background:#fff;color:var(--txt);}
select:focus,input:focus{outline:none;border-color:var(--g3);}

.colunas-box{border-top:1px solid var(--gbg);padding-top:12px;margin-bottom:6px;}
.colunas-box label.titulo{display:block;font-size:11px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.5px;margin-bottom:8px;}
.colunas-lista{display:flex;flex-wrap:wrap;gap:14px;}
.chk-item{display:flex;align-items:center;gap:6px;font-size:13px;}
.chk-item input{width:16px;height:16px;padding:0;accent-color:var(--g3);}
.chk-fixo{opacity:.55;}

.btn{font-family:'Syne',sans-serif;font-weight:700;font-size:12px;letter-spacing:.3px;padding:10px 16px;border-radius:8px;border:none;cursor:pointer;text-transform:uppercase;}
.btn-g{background:var(--g3);color:#fff;}
.btn-g:hover{background:var(--g2);}
.btn-out{background:#fff;color:var(--g3);border:1.5px solid var(--g3);}
.btn-out:hover{background:var(--gbg);}

.tw{overflow-x:auto;margin-top:16px;}
table{width:100%;border-collapse:collapse;font-size:13px;}
thead th{background:var(--g1);color:#fff;padding:10px 12px;text-align:left;white-space:nowrap;font-family:'Syne',sans-serif;font-size:11px;letter-spacing:.4px;text-transform:uppercase;}
tbody tr{border-bottom:1px solid var(--gbg);}
tbody tr:hover{background:var(--gbg);}
tbody td{padding:10px 12px;white-space:nowrap;}
.status-ativo{color:var(--g3);font-weight:600;}
.status-baixado{color:var(--danger);font-weight:600;}
.status-substituido{color:var(--warn);font-weight:600;}
.vazio{padding:40px;text-align:center;color:var(--muted);font-size:14px;}
.bloqueada{max-width:420px;margin:80px auto;text-align:center;background:#fff;border-radius:14px;padding:34px;box-shadow:var(--shadow);}
.bloqueada p{margin-bottom:18px;color:var(--muted);font-size:14px;}

@media print {
  .header, .filtros, .colunas-box, .hdr-voltar, .btn { display: none; }
  body { background: #fff; }
  .main { padding: 0; max-width: 100%; }
  .sec { box-shadow: none; padding: 0; }
}
</style>
</head>
<body>

<div id="telaBloqueada" class="bloqueada" style="display:none;">
  <p>Acesso restrito. Faca login no sistema principal para ver o historico.</p>
  <a href="index.html" class="btn btn-g">Ir para o login</a>
</div>

<div id="conteudoHistorico" style="display:none;">

<div class="header">
  <div class="logo-zone">
    <img id="logoImg" src="" alt="FUMPAPA">
    <div><div style="font-weight:800;color:#fff;">FUMPAPA</div><div style="font-size:10px;color:rgba(255,255,255,.65);">Fundação Papa</div></div>
  </div>
  <div class="hdr-info">
    <h1>🕓 HISTORICO DA FROTA</h1>
    <p>Fundação Papa João Paulo II | Prefeitura de Belém</p>
  </div>
  <div class="hdr-voltar">
    <a href="index.html">← Voltar ao sistema</a>
  </div>
</div>

<div class="main">
  <div class="sec">
    <div class="sec-title">Consultar historico</div>
    <div class="filtros">
      <div class="campo">
        <label>Mes</label>
        <select id="filtroMes"></select>
      </div>
      <div class="campo">
        <label>Ano</label>
        <input type="number" id="filtroAno" style="width:90px;">
      </div>
      <div class="campo">
        <label>Relatorio</label>
        <select id="filtroRelatorio">
          <option value="mensal">Mensal</option>
          <option value="anual">Anual (ano todo)</option>
        </select>
      </div>
      <div class="campo">
        <label>Placa (opcional)</label>
        <input type="text" id="filtroPlaca" placeholder="Ex: ABC1234">
      </div>
      <button class="btn btn-g" onclick="buscar()">🔍 Buscar</button>
      <button class="btn btn-out" onclick="imprimirHistorico()">🖨️ Imprimir / PDF</button>
      <button class="btn btn-out" onclick="exportarExcelFormatado()">📊 Excel (.xlsx)</button>
    </div>

    <div class="colunas-box">
      <label class="titulo">Colunas a incluir</label>
      <div class="colunas-lista">
        <span class="chk-item chk-fixo"><input type="checkbox" checked disabled> Placa</span>
        <span class="chk-item chk-fixo"><input type="checkbox" checked disabled> Local</span>
        <span class="chk-item chk-fixo"><input type="checkbox" checked disabled> Modelo</span>
        <label class="chk-item"><input type="checkbox" id="colCondutor" checked onchange="renderizarTabela()"> Condutor</label>
        <label class="chk-item"><input type="checkbox" id="colSituacao" checked onchange="renderizarTabela()"> Situacao</label>
        <label class="chk-item"><input type="checkbox" id="colContrato" checked onchange="renderizarTabela()"> Contrato</label>
        <label class="chk-item"><input type="checkbox" id="colPeriodo" checked onchange="renderizarTabela()"> Periodo</label>
        <label class="chk-item"><input type="checkbox" id="colStatus" checked onchange="renderizarTabela()"> Status</label>
      </div>
    </div>

    <div class="tw">
      <table id="tabelaHistorico">
        <thead id="cabecalhoTabela"></thead>
        <tbody id="corpoTabela"></tbody>
      </table>
      <div id="mensagemVazia" class="vazio" style="display:none;">Nenhum registro encontrado para o filtro selecionado.</div>
    </div>
  </div>
</div>

</div>

  async function garantirSessaoAnonima() {
    if (!supabaseClient) return;
    try {
      const { data: { session } } = await supabaseClient.auth.getSession();
      if (session && session.access_token) return;
      await supabaseClient.auth.signInAnonymously();

  const logo = localStorage.getItem('logo_fumpapa') || LOGO_FIXA;
  document.getElementById('logoImg').src = logo;

  const meses = ['Janeiro','Fevereiro','Marco','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];

  function preencherFiltros() {
    const selMes = document.getElementById('filtroMes');
    meses.forEach((nome, i) => {
      const opt = document.createElement('option');
      opt.value = i + 1;
      opt.textContent = nome;
      selMes.appendChild(opt);
    });
    const hoje = new Date();
    selMes.value = hoje.getMonth() + 1;

    document.getElementById('filtroAno').value = hoje.getFullYear();
  }

  function formatarData(dataStr) {
    if (!dataStr) return 'atual';
    const [ano, mes, dia] = dataStr.split('-');
    return dia + '/' + mes;
  }

  function statusInfo(r) {
    if (r.status === 'Substituido') {
      return { classe: 'status-substituido', texto: 'Substituido por ' + (r.placa_substituta || '-') };
    }
    if (r.status === 'Baixado') {
      return { classe: 'status-baixado', texto: 'Baixado' + (r.motivo_saida ? ' - ' + r.motivo_saida : '') };
    }
    if (r.status === 'Inativo') {
      return { classe: 'status-baixado', texto: 'Inativo' };
    }
    return { classe: 'status-ativo', texto: 'Ativo' };
  }

  function colunasAtivas() {
    const cols = [
      { chave: 'numero', titulo: 'Nº' }
    ];
    if (document.getElementById('filtroRelatorio').value === 'anual') {
      cols.push({ chave: 'mesLabel', titulo: 'Mês' });
    }
    cols.push(
      { chave: 'placa', titulo: 'Placa' },
      { chave: 'local', titulo: 'Local' },
      { chave: 'veiculo', titulo: 'Modelo' }
    );
    if (document.getElementById('colCondutor').checked) cols.push({ chave: 'condutor', titulo: 'Condutor' });
    if (document.getElementById('colSituacao').checked) cols.push({ chave: 'situacao', titulo: 'Situacao' });
    if (document.getElementById('colContrato').checked) cols.push({ chave: 'contrato', titulo: 'Contrato' });
    if (document.getElementById('colPeriodo').checked) cols.push({ chave: 'periodo', titulo: 'Periodo' });
    if (document.getElementById('colStatus').checked) cols.push({ chave: 'status', titulo: 'Status' });
    return cols;
  }

  function valorColuna(r, chave, idx) {
    switch (chave) {
      case 'numero': return idx + 1;
      case 'mesLabel': return r._mesLabel || '-';
      case 'placa': return (r.placa || '-').toUpperCase();
      case 'local': return (r.local || '-').toUpperCase();
      case 'veiculo': return (r.veiculo || '-').toUpperCase();
      case 'condutor': return (r.condutor || '-').toUpperCase();
      case 'situacao': return (r.situacao || '-').toUpperCase();
      case 'contrato': return (r.contrato || '-').toUpperCase();
      case 'periodo': return formatarData(r.data_inicio) + ' a ' + formatarData(r.data_fim);
      case 'status': return statusInfo(r).texto.toUpperCase();
      default: return '-';
    }
  }

  let ultimoResultado = [];

  function renderizarTabela() {
    const cols = colunasAtivas();
    const cabecalho = document.getElementById('cabecalhoTabela');
    const corpo = document.getElementById('corpoTabela');
    const vazio = document.getElementById('mensagemVazia');

    cabecalho.innerHTML = '<tr>' + cols.map(c => '<th>' + c.titulo + '</th>').join('') + '</tr>';
    corpo.innerHTML = '';

    if (ultimoResultado.length === 0) {
      vazio.style.display = 'block';
      return;
    }
    vazio.style.display = 'none';

    ultimoResultado.forEach((r, i) => {
      const tr = document.createElement('tr');
      tr.innerHTML = cols.map(c => {
        if (c.chave === 'status') {
          return '<td class="' + statusInfo(r).classe + '">' + valorColuna(r, c.chave, i) + '</td>';
        }
        return '<td>' + valorColuna(r, c.chave, i) + '</td>';
      }).join('');
      corpo.appendChild(tr);
    });
  }

  let resultadoAnual = [];

  async function buscarMes(ano, mes, placaFiltro) {
    const inicioMes = ano + '-' + String(mes).padStart(2, '0') + '-01';
    const ultimoDia = new Date(ano, mes, 0).getDate();
    const fimMes = ano + '-' + String(mes).padStart(2, '0') + '-' + ultimoDia;

    let query = supabaseClient
      .from('historico_veiculos')
      .select('*')
      .lte('data_inicio', fimMes)
      .or('data_fim.gte.' + inicioMes + ',data_fim.is.null')
      .order('placa', { ascending: true })
      .order('data_inicio', { ascending: true });

    if (placaFiltro) query = query.eq('placa', placaFiltro);

    const { data, error } = await query;
    if (error) { console.error(error); return []; }
    return data || [];
  }

  async function buscar() {
    if (!supabaseClient) {
      alert('Nao foi possivel conectar ao banco de dados. Verifique sua conexao com a internet e tente novamente.');
      return;
    }

    const ano = parseInt(document.getElementById('filtroAno').value);
    const placaFiltro = document.getElementById('filtroPlaca').value.trim().toUpperCase();
    const modo = document.getElementById('filtroRelatorio').value;

    if (modo === 'anual') {
      resultadoAnual = [];
      let flatten = [];
      for (let m = 1; m <= 12; m++) {
        const dados = await buscarMes(ano, m, placaFiltro);
        resultadoAnual.push({ mes: m, nomeMes: meses[m - 1], dados });
        dados.forEach(r => flatten.push({ ...r, _mesLabel: meses[m - 1] }));
      }
      ultimoResultado = flatten;
      document.getElementById('mensagemVazia').textContent = 'Nenhum registro encontrado para o ano selecionado.';
      renderizarTabela();
      return;
    }

    const mes = parseInt(document.getElementById('filtroMes').value);
    const data = await buscarMes(ano, mes, placaFiltro);
    ultimoResultado = data;
    document.getElementById('mensagemVazia').textContent = 'Nenhum registro encontrado para o filtro selecionado.';
    renderizarTabela();
  }

  function exportarExcelFormatado() {
    const modo = document.getElementById('filtroRelatorio').value;
    if (modo === 'anual') {
      if (resultadoAnual.every(m => m.dados.length === 0)) { alert('Nenhum dado para exportar neste ano!'); return; }
      _gerarExcelAnual();
      return;
    }
    if (ultimoResultado.length === 0) { alert('Nenhum dado para exportar!'); return; }
    _gerarExcelHistorico(ultimoResultado, meses[parseInt(document.getElementById('filtroMes').value) - 1], document.getElementById('filtroAno').value);
  }

  function _adicionarLogoCabecalho(wb, ws, tituloPeriodo, totalRegistros) {
    const logoData = localStorage.getItem('logo_fumpapa') || (typeof LOGO_FIXA !== 'undefined' ? LOGO_FIXA : null);
    if (logoData && logoData.startsWith('data:image')) {
      try {
        const ext = logoData.includes('image/png') ? 'png' : 'jpeg';
        const imgId = wb.addImage({ base64: logoData, extension: ext });
        ws.addImage(imgId, { tl: { col: 0, row: 0 }, ext: { width: 60, height: 60 } });
        ws.getRow(1).height = 46;
      } catch(e) { }
    }
    ws.mergeCells('B1:C1');
    ws.getCell('B1').value = 'FUMPAPA — HISTORICO DA FROTA';
    ws.getCell('B1').font = { bold: true, size: 13 };
    ws.mergeCells('B2:C2');
    ws.getCell('B2').value = tituloPeriodo;
    ws.getCell('B2').font = { bold: true, size: 10, color: { argb: 'FF145A2E' } };
    ws.getCell('D1').value = `DATA: ${new Date().toLocaleDateString('pt-BR')}`;
    ws.getCell('D1').font = { size: 10 };
    ws.getCell('D2').value = `HORA: ${new Date().toLocaleTimeString('pt-BR')}`;
    ws.getCell('D2').font = { size: 10 };
    ws.getCell('E1').value = `TOTAL: ${totalRegistros} REGISTRO(S)`;
    ws.getCell('E1').font = { bold: true, size: 10 };
  }

  function _escreverTabelaExcel(ws, cols, dados, linhaInicial) {
    const bordaFina = { top: {style:'thin'}, left: {style:'thin'}, bottom: {style:'thin'}, right: {style:'thin'} };
    const headerRow = ws.getRow(linhaInicial);
    headerRow.values = cols.map(c => c.titulo);
    headerRow.eachCell(c => {
      c.font = { bold: true, color: { argb: 'FF111111' } };
      c.fill = { type: 'pattern', pattern: 'solid', fgColor: { argb: 'FFB0B0B0' } };
      c.alignment = { horizontal: 'center', vertical: 'middle' };
      c.border = bordaFina;
    });
    let linha = linhaInicial + 1;
    dados.forEach((r, i) => {
      const row = ws.getRow(linha);
      row.values = cols.map(c => valorColuna(r, c.chave, i));
      row.eachCell(c => { c.alignment = { horizontal: 'center', vertical: 'middle' }; c.border = bordaFina; });
      linha++;
    });
    return linha;
  }

  async function _gerarExcelHistorico(dados, mesTexto, anoTexto) {
    const cols = colunasAtivas();
    const wb = new ExcelJS.Workbook();
    const ws = wb.addWorksheet('Historico Frota', { pageSetup: { orientation: 'landscape', fitToPage: true } });
    ws.columns = cols.map(c => ({ width: c.chave === 'numero' ? 6 : (c.chave === 'condutor' || c.chave === 'periodo' ? 22 : 16) }));
    _adicionarLogoCabecalho(wb, ws, `PERIODO: ${mesTexto.toUpperCase()} DE ${anoTexto}`, dados.length);
    _escreverTabelaExcel(ws, cols, dados, 4);

    const buffer = await wb.xlsx.writeBuffer();
    const blob = new Blob([buffer], { type: 'application/octet-stream' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = `historico_frota_${new Date().toISOString().slice(0,10)}.xlsx`;
    a.click();
    alert('✅ Relatório .xlsx exportado!');
  }

  async function _gerarExcelAnual() {
    const anoTexto = document.getElementById('filtroAno').value;
    const cols = colunasAtivas();
    const wb = new ExcelJS.Workbook();

    resultadoAnual.forEach(bloco => {
      const ws = wb.addWorksheet(bloco.nomeMes.slice(0, 28), { pageSetup: { orientation: 'landscape', fitToPage: true } });
      ws.columns = cols.map(c => ({ width: c.chave === 'numero' ? 6 : (c.chave === 'condutor' || c.chave === 'periodo' ? 22 : 16) }));
      _adicionarLogoCabecalho(wb, ws, `PERIODO: ${bloco.nomeMes.toUpperCase()} DE ${anoTexto}`, bloco.dados.length);
      _escreverTabelaExcel(ws, cols, bloco.dados, 4);
    });

    const buffer = await wb.xlsx.writeBuffer();
    const blob = new Blob([buffer], { type: 'application/octet-stream' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = `historico_frota_anual_${anoTexto}.xlsx`;
    a.click();
    alert('✅ Relatório anual .xlsx exportado, um mes por aba!');
  }

  function _montarSecaoImpressao(cols, dados, tituloPeriodo, quebrarPagina) {
    const theadHtml = '<tr>' + cols.map(c => '<th>' + c.titulo + '</th>').join('') + '</tr>';
    let linhasHtml = '';
    dados.forEach((r, i) => {
      linhasHtml += '<tr>' + cols.map(c => '<td>' + valorColuna(r, c.chave, i) + '</td>').join('') + '</tr>';
    });
    return `
      <div class="secao"${quebrarPagina ? ' style="page-break-before: always;"' : ''}>
        <div class="subtitulo">${tituloPeriodo} — ${dados.length} registro(s)</div>
        <table>
          <thead>${theadHtml}</thead>
          <tbody>${linhasHtml || '<tr><td colspan="' + cols.length + '" style="padding:10px;">Nenhum registro neste mes</td></tr>'}</tbody>
        </table>
      </div>`;
  }

  function imprimirHistorico() {
    const modo = document.getElementById('filtroRelatorio').value;
    const anoTexto = document.getElementById('filtroAno').value;
    const cols = colunasAtivas();
    const logoData = localStorage.getItem('logo_fumpapa') || (typeof LOGO_FIXA !== 'undefined' ? LOGO_FIXA : null);
    const logoHtml = logoData ? `<img src="${logoData}" style="height:60px;object-fit:contain;">` : '<div style="font-size:32px;">🏛️</div>';

    let tituloTopo, secoesHtml, totalGeral;

    if (modo === 'anual') {
      if (resultadoAnual.every(m => m.dados.length === 0)) { alert('Nenhum dado para imprimir neste ano!'); return; }
      tituloTopo = `Relatorio Anual — ${anoTexto}`;
      totalGeral = resultadoAnual.reduce((s, m) => s + m.dados.length, 0);
      secoesHtml = resultadoAnual.map((bloco, i) => _montarSecaoImpressao(cols, bloco.dados, bloco.nomeMes + ' de ' + anoTexto, i > 0)).join('');
    } else {
      if (ultimoResultado.length === 0) { alert('Nenhum dado para imprimir!'); return; }
      const mesTexto = meses[parseInt(document.getElementById('filtroMes').value) - 1];
      tituloTopo = `${mesTexto} de ${anoTexto}`;
      totalGeral = ultimoResultado.length;
      secoesHtml = _montarSecaoImpressao(cols, ultimoResultado, tituloTopo, false);
    }

    const html = `
    <html lang="pt-BR">
    <head>
      <meta charset="UTF-8">
      <title>Historico da Frota</title>
      <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: Arial, sans-serif; color: #0a1f10; background: white; }
        .page { padding: 20px 30px; }
        .header { display: flex; align-items: center; gap: 16px; margin-bottom: 20px; border-bottom: 3px solid #0f2a5c; padding-bottom: 14px; }
        .header-info h1 { font-size: 18px; color: #0f2a5c; }
        .header-info p { font-size: 11px; color: #4a6b54; margin-top: 2px; }
        .header-info .titulo { font-size: 14px; font-weight: bold; color: #16305c; margin-top: 4px; }
        .rodape { margin-top: 24px; border-top: 2px solid #0f2a5c; padding-top: 10px; display: flex; justify-content: space-between; font-size: 10px; color: #4a6b54; }
        .total-geral { text-align: right; font-size: 14px; font-weight: bold; color: #0f2a5c; margin-bottom: 8px; }
        .subtitulo { font-size: 12px; font-weight: bold; color: #0f2a5c; background: #eaf1fb; padding: 6px 10px; margin-bottom: 8px; border-radius: 4px; }
        table { width: 100%; border-collapse: collapse; font-size: 11px; margin-bottom: 14px; }
        thead th { background: #0f2a5c; color: #fff; padding: 6px 8px; text-align: center; border: 1px solid #000; }
        tbody td { padding: 5px 8px; text-align: center; border: 1px solid #000; }
        @media print {
          @page { size: A4 landscape; margin: 12mm; }
          body { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
        }
      </style>
    </head>
    <body>
      <div class="page">
        <div class="header">
          ${logoHtml}
          <div class="header-info">
            <h1>🕓 FUMPAPA — Historico da Frota</h1>
            <p>Fundação Papa João Paulo II — Prefeitura de Belém/PA</p>
            <div class="titulo">${tituloTopo}</div>
          </div>
          <div style="margin-left:auto;text-align:right;font-size:11px;color:#4a6b54;">
            <div>Data: ${new Date().toLocaleDateString('pt-BR')}</div>
            <div>Hora: ${new Date().toLocaleTimeString('pt-BR')}</div>
            <div style="font-weight:bold;color:#0f2a5c;">Total: ${totalGeral} registro(s)</div>
          </div>
        </div>

        <div class="total-geral">TOTAL GERAL: ${totalGeral} REGISTRO(S)</div>
        ${secoesHtml}

        <div class="rodape">
          <span>Sistema de Gestão de Frota FUMPAPA — Documento gerado eletronicamente</span>
          <span>${new Date().toLocaleString('pt-BR')}</span>
        </div>
      </div>
      <script>
        window.onload = function() {
          setTimeout(function() { window.print(); }, 400);
        };
      <\/script>
    </body>
    </html>
    `;

    const win = window.open('', '_blank', 'width=1100,height=750');
    win.document.write(html);
    win.document.close();
  }

  const temAdmin = localStorage.getItem('fumpapa_admin_token');
  const temToken = localStorage.getItem('fumpapa_frota_token');

  if (!temAdmin && !temToken) {
    document.getElementById('telaBloqueada').style.display = 'block';
  } else {
    garantirSessaoAnonima();
    document.getElementById('conteudoHistorico').style.display = 'block';
    preencherFiltros();
    buscar();
  }
</script>

</body>
